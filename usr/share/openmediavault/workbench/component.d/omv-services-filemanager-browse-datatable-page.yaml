version: "1.0"
type: component
data:
  name: omv-services-filemanager-browse-datatable-page
  type: datatablePage
  config:
    autoReload: false
    hasSearchField: true
    rowId: path
    rowEnumFmt: "{{ name }}"
    stateId: 5f3a7c10-5f2e-11ef-9a1b-abcdef012302
    sorters:
      - dir: asc
        prop: name
    store:
      proxy:
        service: FileManager
        get:
          method: getList
          params:
            # The route context is lost after a redirect that opens a new
            # tab (preview, download, upload), so fall back to the
            # selected row, which carries the same values.
            uuid: "{{ _routeParams.uuid or _selected[0].uuid }}"
            path: "{{ _routeParams.path or _selected[0].dirpath }}"
            # Is this the alternate folder route (/services/filemanager/open/...)?
            # Folder links point to the other route, see getList.
            altroute: "{{ (_routeUrlSegments[2] == 'open') if _routeParams.uuid else (_selected[0].route == 'browse') }}"
    columns:
      - name: _("Type")
        prop: type
        flexGrow: 1
        sortable: true
        cellTemplateName: chip
        cellTemplateConfig:
          map:
            parentdir:
              value: _("Parent")
            dir:
              value: _("Folder")
            file:
              value: _("File")
            brokenlink:
              value: _("Broken link")
      # Clicking a folder opens it, clicking a file opens it in a new
      # browser tab (or downloads it if the browser cannot show it).
      - name: _("Name")
        prop: name
        flexGrow: 3
        sortable: true
        cellTemplateName: template
        cellTemplateConfig: >-
          {% if type == "file" %}<a href="download.php?service=FileManager&method=preview&params={{ ('{"uuid":"' ~ uuid ~ '","path":"' ~ path ~ '"}') | encodeuricomponent }}" target="_blank" rel="noopener">{{ name }}</a>{% elif type == "parentdir" and not path %}<a href="#/services/filemanager/browse">{{ name }}</a>{% elif type in ["dir", "parentdir"] %}<a href="#/services/filemanager/{{ route }}/{{ uuid }}/{{ path }}">{{ name }}</a>{% else %}{{ name }}{% endif %}
      - name: _("Size")
        prop: size
        flexGrow: 1
        sortable: true
        cellTemplateName: template
        cellTemplateConfig: '{{ "-" if size < 0 else (size | tobytes | binaryunit) }}'
      - name: _("Modified")
        prop: mtime
        flexGrow: 1
        sortable: true
        cellTemplateName: localeDateTime
      - name: _("Owner")
        prop: owner
        flexGrow: 1
        sortable: true
        hidden: true
        cellTemplateName: template
        cellTemplateConfig: '{{ owner }}{{ ":" ~ group if group }}'
      - name: _("Permissions")
        prop: mode
        flexGrow: 1
        sortable: true
      - name: _("Link target")
        prop: link
        flexGrow: 2
        sortable: true
        hidden: true
    actions:
      # Descend into a folder (or ".." parent). The ".." of the top level
      # leads back to the list of shared folders.
      - type: iconButton
        icon: mdi:folder-open-outline
        tooltip: _("Open")
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
          constraint:
            - operator: in
              arg0:
                prop: type
              arg1: ["dir", "parentdir"]
        execute:
          type: url
          url: "/services/filemanager/{{ (route ~ '/' ~ uuid ~ '/' ~ path) if path else 'browse' }}"
      # Edit a text file in the code editor. The current folder is passed
      # along so the editor can return to it.
      - type: iconButton
        icon: mdi:file-edit-outline
        tooltip: _("Edit")
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
          constraint:
            - operator: truthy
              arg0:
                prop: editable
        execute:
          type: url
          url: "/services/filemanager/edit/{{ uuid }}/{{ dirpath }}/{{ path }}"
      # Show images, PDFs, audio, video and text in a new browser tab.
      # Other files are downloaded.
      - type: iconButton
        icon: mdi:eye-outline
        tooltip: _("Preview")
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
          constraint:
            - operator: eq
              arg0:
                prop: type
              arg1: file
        execute:
          type: url
          url: '/externalRedirect/{{ (''download.php?service=FileManager&method=preview&params={"uuid":"'' ~ uuid ~ ''","path":"'' ~ path ~ ''"}'') | encodeuricomponent }}'
      # A single file is downloaded as is, folders and multiple items as
      # one ZIP archive.
      - type: iconButton
        icon: mdi:download
        tooltip: _("Download")
        enabledConstraints:
          minSelected: 1
          constraint:
            - operator: in
              arg0:
                prop: type
              arg1: ["dir", "file"]
        execute:
          type: url
          url: '/download?service=FileManager&method={{ "download" if (_selected | length) == 1 else "downloadArchive" }}&params={"uuid":"{{ _selected[0].uuid }}","path":"{{ _selected[0].path }}","paths":"{{ _selected | join(",", "path") }}"}'
      - type: menu
        icon: add
        tooltip: _("Create")
        actions:
          - text: _("Upload files")
            icon: mdi:upload
            execute:
              type: url
              url: "/externalRedirect/{{ ('filemanager-upload.php?uuid=' ~ _routeParams.uuid ~ '&path=' ~ _routeParams.path) | encodeuricomponent }}"
          - text: _("New folder")
            icon: mdi:folder-plus-outline
            execute:
              type: formDialog
              formDialog:
                title: _("New folder")
                fields:
                  # Submit buttons only see the form values, so the
                  # target is passed via hidden fields.
                  - type: hidden
                    name: uuid
                    value: "{{ _routeParams.uuid }}"
                  - type: hidden
                    name: path
                    value: "{{ _routeParams.path }}"
                  - type: textInput
                    name: name
                    label: _("Name")
                    validators:
                      required: true
                buttons:
                  submit:
                    text: _("Create")
                    execute:
                      type: request
                      request:
                        service: FileManager
                        method: mkDir
                        successNotification: _("Folder created.")
          - text: _("New file")
            icon: mdi:file-plus-outline
            execute:
              type: formDialog
              formDialog:
                title: _("New file")
                fields:
                  - type: hidden
                    name: uuid
                    value: "{{ _routeParams.uuid }}"
                  - type: hidden
                    name: path
                    value: "{{ _routeParams.path }}"
                  - type: textInput
                    name: name
                    label: _("Name")
                    validators:
                      required: true
                buttons:
                  submit:
                    text: _("Create")
                    execute:
                      type: request
                      request:
                        service: FileManager
                        method: mkFile
                        successNotification: _("File created.")
      - type: iconButton
        icon: mdi:rename-box
        tooltip: _("Rename")
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
          constraint:
            - operator: ne
              arg0:
                prop: type
              arg1: parentdir
        execute:
          type: formDialog
          formDialog:
            title: _("Rename")
            fields:
              - type: hidden
                name: uuid
                value: "{{ _selected[0].uuid }}"
              - type: hidden
                name: path
                value: "{{ _selected[0].path }}"
              - type: textInput
                name: name
                label: _("New name")
                value: "{{ _selected[0].name }}"
                validators:
                  required: true
            buttons:
              submit:
                text: _("Rename")
                execute:
                  type: request
                  request:
                    service: FileManager
                    method: rename
                    successNotification: _("Renamed.")
      - type: menu
        icon: mdi:file-move-outline
        tooltip: _("Copy or move")
        enabledConstraints:
          minSelected: 1
          constraint:
            - operator: ne
              arg0:
                prop: type
              arg1: parentdir
        actions:
          - text: _("Copy to ...")
            icon: mdi:content-copy
            enabledConstraints:
              minSelected: 1
              constraint:
                - operator: ne
                  arg0:
                    prop: type
                  arg1: parentdir
            execute:
              type: formDialog
              formDialog:
                title: _("Copy to ...")
                fields: &transferFields
                  - type: hidden
                    name: uuid
                    value: "{{ _selected[0].uuid }}"
                  - type: hidden
                    name: paths
                    value: '{{ _selected | join(",", "path") }}'
                  - type: select
                    name: destuuid
                    label: _("Shared folder")
                    value: "{{ _selected[0].uuid }}"
                    valueField: uuid
                    textField: name
                    store:
                      proxy:
                        service: FileManager
                        get:
                          method: enumerateBrowsableFolders
                    validators:
                      required: true
                  - type: folderBrowser
                    name: destpath
                    label: _("Folder")
                    hint: _("The destination folder, relative to the shared folder. Leave empty for the top level.")
                    value: ""
                    dirType: sharedfolder
                    dirRefIdField: destuuid
                  - type: checkbox
                    name: overwrite
                    label: _("Overwrite existing items")
                    value: false
                buttons:
                  submit:
                    text: _("Copy")
                    execute:
                      type: taskDialog
                      taskDialog:
                        config:
                          title: _("Copying ...")
                          startOnInit: true
                          request:
                            service: FileManager
                            method: transfer
                            params: &transferParams
                              uuid: "{{ uuid }}"
                              paths: "{{ paths }}"
                              destuuid: "{{ destuuid }}"
                              destpath: "{{ destpath }}"
                              overwrite: "{{ overwrite }}"
                              mode: copy
          - text: _("Move to ...")
            icon: mdi:file-move-outline
            enabledConstraints:
              minSelected: 1
              constraint:
                - operator: ne
                  arg0:
                    prop: type
                  arg1: parentdir
            execute:
              type: formDialog
              formDialog:
                title: _("Move to ...")
                fields: *transferFields
                buttons:
                  submit:
                    text: _("Move")
                    execute:
                      type: taskDialog
                      taskDialog:
                        config:
                          title: _("Moving ...")
                          startOnInit: true
                          request:
                            service: FileManager
                            method: transfer
                            params:
                              <<: *transferParams
                              mode: move
      - type: menu
        icon: mdi:archive-outline
        tooltip: _("Archive")
        actions:
          - text: _("Compress ...")
            icon: mdi:archive-arrow-down-outline
            enabledConstraints:
              minSelected: 1
              constraint:
                - operator: ne
                  arg0:
                    prop: type
                  arg1: parentdir
            execute:
              type: formDialog
              formDialog:
                title: _("Compress")
                fields:
                  - type: hidden
                    name: uuid
                    value: "{{ _selected[0].uuid }}"
                  - type: hidden
                    name: paths
                    value: '{{ _selected | join(",", "path") }}'
                  - type: textInput
                    name: name
                    label: _("Archive name")
                    value: '{{ _selected[0].name if (_selected | length) == 1 else "archive" }}'
                    validators:
                      required: true
                  - type: select
                    name: format
                    label: _("Format")
                    value: zip
                    store:
                      data:
                        - ["zip", "ZIP (.zip)"]
                        - ["tar.gz", "Gzipped tar (.tar.gz)"]
                buttons:
                  submit:
                    text: _("Compress")
                    execute:
                      type: taskDialog
                      taskDialog:
                        config:
                          title: _("Compressing ...")
                          startOnInit: true
                          request:
                            service: FileManager
                            method: compress
                            params:
                              uuid: "{{ uuid }}"
                              paths: "{{ paths }}"
                              name: "{{ name }}"
                              format: "{{ format }}"
          - text: _("Extract")
            icon: mdi:archive-arrow-up-outline
            enabledConstraints:
              minSelected: 1
              maxSelected: 1
              constraint:
                - operator: truthy
                  arg0:
                    prop: archive
            execute:
              type: taskDialog
              taskDialog:
                config:
                  title: _("Extracting ...")
                  startOnInit: true
                  request:
                    service: FileManager
                    method: extract
                    params:
                      uuid: "{{ _selected[0].uuid }}"
                      path: "{{ _selected[0].path }}"
      - type: menu
        icon: mdi:shield-account-outline
        tooltip: _("Permissions")
        actions:
          - text: _("Change permissions ...")
            icon: mdi:lock-outline
            enabledConstraints:
              minSelected: 1
              constraint:
                - operator: in
                  arg0:
                    prop: type
                  arg1: ["dir", "file"]
            execute:
              type: formDialog
              formDialog:
                title: _("Change permissions")
                fields:
                  - type: hidden
                    name: uuid
                    value: "{{ _selected[0].uuid }}"
                  - type: hidden
                    name: paths
                    value: '{{ _selected | join(",", "path") }}'
                  - type: textInput
                    name: mode
                    label: _("Mode")
                    hint: _("Octal mode, e.g. 0775 or 0664.")
                    value: "{{ _selected[0].mode }}"
                    validators:
                      required: true
                      pattern:
                        pattern: "^[0-7]{3,4}$"
                        errorData: _("Enter an octal mode, e.g. 0775.")
                  - type: checkbox
                    name: recursive
                    label: _("Recursive")
                    hint: _("Apply to the contents of folders, too. Execute permissions are only given to folders and to files that are already executable.")
                    value: false
                buttons:
                  submit:
                    text: _("Apply")
                    execute:
                      type: taskDialog
                      taskDialog:
                        config:
                          title: _("Changing permissions ...")
                          startOnInit: true
                          request:
                            service: FileManager
                            method: chmod
                            params:
                              uuid: "{{ uuid }}"
                              paths: "{{ paths }}"
                              mode: "{{ mode }}"
                              recursive: "{{ recursive }}"
          - text: _("Change owner ...")
            icon: mdi:account-edit-outline
            enabledConstraints:
              minSelected: 1
              constraint:
                - operator: in
                  arg0:
                    prop: type
                  arg1: ["dir", "file"]
            execute:
              type: formDialog
              formDialog:
                title: _("Change owner")
                fields:
                  - type: hidden
                    name: uuid
                    value: "{{ _selected[0].uuid }}"
                  - type: hidden
                    name: paths
                    value: '{{ _selected | join(",", "path") }}'
                  - type: select
                    name: owner
                    label: _("Owner")
                    value: "{{ _selected[0].owner }}"
                    valueField: name
                    textField: name
                    store:
                      proxy:
                        service: FileManager
                        get:
                          method: enumerateUsers
                    validators:
                      required: true
                  - type: select
                    name: group
                    label: _("Group")
                    value: "{{ _selected[0].group }}"
                    valueField: name
                    textField: name
                    store:
                      proxy:
                        service: FileManager
                        get:
                          method: enumerateGroups
                    validators:
                      required: true
                  - type: checkbox
                    name: recursive
                    label: _("Recursive")
                    value: false
                buttons:
                  submit:
                    text: _("Apply")
                    execute:
                      type: taskDialog
                      taskDialog:
                        config:
                          title: _("Changing owner ...")
                          startOnInit: true
                          request:
                            service: FileManager
                            method: chown
                            params:
                              uuid: "{{ uuid }}"
                              paths: "{{ paths }}"
                              owner: "{{ owner }}"
                              group: "{{ group }}"
                              recursive: "{{ recursive }}"
      - type: iconButton
        icon: mdi:information-outline
        tooltip: _("Properties")
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
          constraint:
            - operator: ne
              arg0:
                prop: type
              arg1: parentdir
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Properties")
              startOnInit: true
              request:
                service: FileManager
                method: getProperties
                params:
                  uuid: "{{ _selected[0].uuid }}"
                  path: "{{ _selected[0].path }}"
      - type: iconButton
        icon: mdi:magnify
        tooltip: _("Search in this folder and its subfolders")
        execute:
          type: formDialog
          formDialog:
            title: _("Search")
            fields:
              - type: hidden
                name: uuid
                value: "{{ _routeParams.uuid }}"
              - type: hidden
                name: path
                value: "{{ _routeParams.path }}"
              - type: textInput
                name: query
                label: _("Name")
                hint: _("Part of the name, case-insensitive. Wildcards (* and ?) are supported.")
                validators:
                  required: true
            buttons:
              submit:
                text: _("Search")
                execute:
                  type: url
                  url: "/services/filemanager/search/{{ uuid }}/{{ path }}/{{ query | encodeuricomponent }}"
      - type: menu
        icon: mdi:delete-restore
        tooltip: _("Trash")
        actions:
          - text: _("Restore")
            icon: mdi:restore
            enabledConstraints:
              minSelected: 1
              constraint:
                - operator: truthy
                  arg0:
                    prop: trashed
            execute:
              type: request
              request:
                service: FileManager
                method: restore
                params:
                  uuid: "{{ uuid }}"
                  path: "{{ path }}"
                progressMessage: _("Restoring ...")
                successNotification: _("Restored.")
          - text: _("Open trash")
            icon: mdi:delete-outline
            execute:
              type: url
              # The path token of ".recycle", on the other folder route
              # than the current one, see getList.
              url: "/services/filemanager/{{ 'browse' if _routeUrlSegments[2] == 'open' else 'open' }}/{{ _routeParams.uuid }}/LnJlY3ljbGU"
          - text: _("Empty trash")
            icon: mdi:delete-empty-outline
            confirmationDialogConfig:
              template: confirmation-danger
              message: _("Do you really want to permanently delete all items in the trash of this shared folder?")
            execute:
              type: request
              request:
                service: FileManager
                method: emptyTrash
                params:
                  uuid: "{{ _routeParams.uuid }}"
                progressMessage: _("Emptying trash ...")
                successNotification: _("Trash emptied.")
      # Moves the items to the trash (if enabled); asks for confirmation.
      - template: delete
        enabledConstraints:
          minSelected: 1
          constraint:
            - operator: ne
              arg0:
                prop: type
              arg1: parentdir
        execute:
          type: request
          request:
            service: FileManager
            method: delete
            params:
              uuid: "{{ uuid }}"
              path: "{{ path }}"
      - type: iconButton
        icon: mdi:delete-forever-outline
        tooltip: _("Delete permanently")
        enabledConstraints:
          minSelected: 1
          constraint:
            - operator: ne
              arg0:
                prop: type
              arg1: parentdir
        confirmationDialogConfig:
          template: confirmation-danger
          title: _("Delete permanently")
          message: _("Do you really want to permanently delete the selected item(s)? This cannot be undone.")
        execute:
          type: request
          request:
            service: FileManager
            method: delete
            params:
              uuid: "{{ uuid }}"
              path: "{{ path }}"
              permanent: true
            progressMessage: _("Deleting ...")
            successNotification: _("Deleted.")
