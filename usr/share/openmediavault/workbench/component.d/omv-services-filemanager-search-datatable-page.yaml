version: "1.0"
type: component
data:
  name: omv-services-filemanager-search-datatable-page
  type: datatablePage
  config:
    autoReload: false
    hasSearchField: true
    rowId: path
    rowEnumFmt: "{{ location }}/{{ name }}"
    stateId: 7c1d2e9a-6a4b-4f0e-9d1c-2b8f3e5a6c71
    sorters:
      - dir: asc
        prop: location
    store:
      proxy:
        service: FileManager
        get:
          method: search
          params:
            uuid: "{{ _routeParams.uuid }}"
            path: "{{ _routeParams.path }}"
            query: "{{ _routeParams.query }}"
    columns:
      - name: _("Type")
        prop: type
        flexGrow: 1
        sortable: true
        cellTemplateName: chip
        cellTemplateConfig:
          map:
            dir:
              value: _("Folder")
            file:
              value: _("File")
            brokenlink:
              value: _("Broken link")
      # Clicking a folder opens it, clicking a file opens it in a new
      # browser tab (or downloads it if the browser cannot show it).
      - name: _("Name")
        prop: name
        flexGrow: 3
        sortable: true
        cellTemplateName: template
        cellTemplateConfig: >-
          {% if type == "file" %}<a href="download.php?service=FileManager&method=preview&params={{ ('{"uuid":"' ~ uuid ~ '","path":"' ~ path ~ '"}') | encodeuricomponent }}" target="_blank" rel="noopener">{{ name }}</a>{% elif type == "dir" %}<a href="#/services/filemanager/browse/{{ uuid }}/{{ path }}">{{ name }}</a>{% else %}{{ name }}{% endif %}
      - name: _("Location")
        prop: location
        flexGrow: 3
        sortable: true
      - name: _("Size")
        prop: size
        flexGrow: 1
        sortable: true
        cellTemplateName: template
        cellTemplateConfig: '{{ "-" if size < 0 else (size | tobytes | binaryunit) }}'
      - name: _("Modified")
        prop: mtime
        flexGrow: 1
        sortable: true
        cellTemplateName: localeDateTime
    actions:
      - type: iconButton
        icon: mdi:folder-open-outline
        tooltip: _("Open folder")
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
        execute:
          type: url
          # Open folders themselves, otherwise the containing folder.
          url: "/services/filemanager/browse/{{ _routeParams.uuid }}/{{ _selected[0].path if _selected[0].type == 'dir' else _selected[0].dirpath }}"
      - type: iconButton
        icon: mdi:file-edit-outline
        tooltip: _("Edit")
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
          constraint:
            - operator: truthy
              arg0:
                prop: editable
        execute:
          type: url
          url: "/services/filemanager/edit/{{ _routeParams.uuid }}/{{ _selected[0].dirpath }}/{{ _selected[0].path }}"
      - type: iconButton
        icon: mdi:eye-outline
        tooltip: _("Preview")
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
          constraint:
            - operator: eq
              arg0:
                prop: type
              arg1: file
        execute:
          type: url
          url: '/externalRedirect/{{ (''download.php?service=FileManager&method=preview&params={"uuid":"'' ~ _routeParams.uuid ~ ''","path":"'' ~ path ~ ''"}'') | encodeuricomponent }}'
      - type: iconButton
        icon: mdi:download
        tooltip: _("Download")
        enabledConstraints:
          minSelected: 1
          constraint:
            - operator: in
              arg0:
                prop: type
              arg1: ["dir", "file"]
        execute:
          type: url
          url: '/download?service=FileManager&method={{ "download" if (_selected | length) == 1 else "downloadArchive" }}&params={"uuid":"{{ _routeParams.uuid }}","path":"{{ _selected[0].path }}","paths":"{{ _selected | join(",", "path") }}"}'
      - type: iconButton
        icon: mdi:information-outline
        tooltip: _("Properties")
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Properties")
              startOnInit: true
              request:
                service: FileManager
                method: getProperties
                params:
                  uuid: "{{ _routeParams.uuid }}"
                  path: "{{ _selected[0].path }}"
      - type: iconButton
        icon: mdi:fingerprint
        tooltip: _("Checksum")
        enabledConstraints:
          minSelected: 1
          constraint:
            - operator: eq
              arg0:
                prop: type
              arg1: file
        execute:
          type: formDialog
          formDialog:
            title: _("Checksum")
            fields:
              - type: hidden
                name: uuid
                value: "{{ _routeParams.uuid }}"
              - type: hidden
                name: paths
                value: '{{ _selected | join(",", "path") }}'
              - type: select
                name: algorithm
                label: _("Algorithm")
                value: sha256
                store:
                  data:
                    - ["md5", "MD5"]
                    - ["sha1", "SHA-1"]
                    - ["sha256", "SHA-256"]
                    - ["sha512", "SHA-512"]
            buttons:
              submit:
                text: _("Calculate")
                execute:
                  type: taskDialog
                  taskDialog:
                    config:
                      title: _("Checksum")
                      startOnInit: true
                      request:
                        service: FileManager
                        method: checksum
                        params:
                          uuid: "{{ uuid }}"
                          paths: "{{ paths }}"
                          algorithm: "{{ algorithm }}"
      - template: delete
        execute:
          type: request
          request:
            service: FileManager
            method: delete
            params:
              uuid: "{{ _routeParams.uuid }}"
              path: "{{ path }}"
