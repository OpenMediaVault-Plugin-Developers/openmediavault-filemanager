version: "1.0"
type: component
data:
  name: omv-services-filemanager-tree-page
  type: datatablePage
  config:
    autoReload: false
    hasSearchField: true
    rowId: path
    rowEnumFmt: "{{ name }}"
    stateId: bf272779-b5ae-48ce-a26a-446979aabc5c
    selectionType: multi
    # Disable paging, it would split the tree.
    limit: 0
    treeFromRelation: parent
    treeToRelation: path
    store:
      proxy:
        service: FileManager
        get:
          method: getList
          params:
            # The route context is lost after a redirect that opens a new
            # tab (preview, download, upload), so prefer the shared folder
            # of the expanded or selected row.
            uuid: "{{ _parent.uuid or _routeParams.uuid or _selected[0].uuid }}"
            # `_parent` is the row being expanded; it is undefined for
            # the top level rows.
            path: "{{ _parent.path | default('root') }}"
      # getList injects a ".." entry for the flat view; a tree does not
      # need it.
      filters:
        - operator: ne
          arg0:
            prop: type
          arg1: parentdir
      # 'dir' sorts before 'file', so folders are listed first.
      sorters:
        - prop: type
          dir: asc
        - prop: name
          dir: asc
      transform:
        treeStatus: "{{ 'collapsed' if type == 'dir' else 'disabled' }}"
    columns:
      # Clicking a folder opens it in the list view, clicking a file
      # opens it in a new browser tab (or downloads it if the browser
      # cannot show it).
      - name: _("Name")
        prop: name
        flexGrow: 4
        sortable: true
        isTreeColumn: true
        treeLevelIndent: 24
        cellTemplateName: template
        cellTemplateConfig: >-
          {% if type == "file" %}<a href="download.php?service=FileManager&method=preview&params={{ ('{"uuid":"' ~ uuid ~ '","path":"' ~ path ~ '"}') | encodeuricomponent }}" target="_blank" rel="noopener">{{ name }}</a>{% elif type == "dir" %}<a href="#/services/filemanager/browse/{{ uuid }}/{{ path }}">{{ name }}</a>{% else %}{{ name }}{% endif %}
      - name: _("Size")
        prop: size
        flexGrow: 1
        sortable: true
        cellTemplateName: template
        cellTemplateConfig: "{{ '' if size < 0 else (size | tobytes | binaryunit) }}"
      - name: _("Modified")
        prop: mtime
        flexGrow: 2
        sortable: true
        cellTemplateName: localeDateTime
      - name: _("Owner")
        prop: owner
        flexGrow: 1
        sortable: true
        hidden: true
        cellTemplateName: template
        cellTemplateConfig: '{{ owner }}{{ ":" ~ group if group }}'
      - name: _("Permissions")
        prop: mode
        flexGrow: 1
    actions:
      - type: iconButton
        icon: mdi:folder-open-outline
        tooltip: _("Open")
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
          constraint:
            - operator: eq
              arg0:
                prop: type
              arg1: dir
        execute:
          type: url
          url: "/services/filemanager/browse/{{ uuid }}/{{ path }}"
      - type: iconButton
        icon: mdi:file-edit-outline
        tooltip: _("Edit")
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
          constraint:
            - operator: truthy
              arg0:
                prop: editable
        execute:
          type: url
          url: "/services/filemanager/edit/{{ uuid }}/{{ dirpath }}/{{ path }}"
      - type: iconButton
        icon: mdi:eye-outline
        tooltip: _("Preview")
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
          constraint:
            - operator: eq
              arg0:
                prop: type
              arg1: file
        execute:
          type: url
          url: '/externalRedirect/{{ (''download.php?service=FileManager&method=preview&params={"uuid":"'' ~ uuid ~ ''","path":"'' ~ path ~ ''"}'') | encodeuricomponent }}'
      - type: iconButton
        icon: mdi:download
        tooltip: _("Download")
        enabledConstraints:
          minSelected: 1
          constraint:
            - operator: in
              arg0:
                prop: type
              arg1: ["dir", "file"]
        execute:
          type: url
          url: '/download?service=FileManager&method={{ "download" if (_selected | length) == 1 else "downloadArchive" }}&params={"uuid":"{{ _selected[0].uuid }}","path":"{{ _selected[0].path }}","paths":"{{ _selected | join(",", "path") }}"}'
      - type: menu
        icon: add
        tooltip: _("Create")
        actions:
          # The following actions work inside the selected folder, or at
          # the top level if nothing is selected.
          - text: _("Upload files")
            icon: mdi:upload
            enabledConstraints:
              maxSelected: 1
              constraint:
                - operator: eq
                  arg0:
                    prop: type
                  arg1: dir
            execute:
              type: url
              url: "/externalRedirect/{{ ('filemanager-upload.php?uuid=' ~ (_selected[0].uuid or _routeParams.uuid) ~ '&path=' ~ (_selected[0].path if (_selected | length) else 'root')) | encodeuricomponent }}"
          - text: _("Download from URL")
            icon: mdi:cloud-download-outline
            enabledConstraints:
              maxSelected: 1
              constraint:
                - operator: eq
                  arg0:
                    prop: type
                  arg1: dir
            execute:
              type: formDialog
              formDialog:
                title: _("Download from URL")
                fields:
                  - type: hidden
                    name: uuid
                    value: "{{ _selected[0].uuid or _routeParams.uuid }}"
                  - type: hidden
                    name: path
                    value: "{{ _selected[0].path if (_selected | length) else 'root' }}"
                  - type: textInput
                    name: url
                    label: _("URL")
                    hint: _("A http:// or https:// URL. Addresses in the local network are not allowed.")
                    validators:
                      required: true
                      pattern:
                        pattern: "^[hH][tT][tT][pP][sS]?://.+"
                        errorData: _("Enter a http:// or https:// URL.")
                  - type: textInput
                    name: name
                    label: _("File name")
                    hint: _("Leave empty to use the name provided by the server.")
                    value: ""
                  - type: checkbox
                    name: overwrite
                    label: _("Overwrite an existing file")
                    hint: _("Otherwise a number is appended to the name.")
                    value: false
                buttons:
                  submit:
                    text: _("Download")
                    execute:
                      type: taskDialog
                      taskDialog:
                        config:
                          title: _("Downloading ...")
                          startOnInit: true
                          request:
                            service: FileManager
                            method: downloadUrl
                            params:
                              uuid: "{{ uuid }}"
                              path: "{{ path }}"
                              url: "{{ url }}"
                              name: "{{ name }}"
                              overwrite: "{{ overwrite }}"
          - text: _("New folder")
            icon: mdi:folder-plus-outline
            enabledConstraints:
              maxSelected: 1
              constraint:
                - operator: eq
                  arg0:
                    prop: type
                  arg1: dir
            execute:
              type: formDialog
              formDialog:
                title: _("New folder")
                fields:
                  # Submit buttons only see the form values, so the
                  # target is passed via hidden fields.
                  - type: hidden
                    name: uuid
                    value: "{{ _selected[0].uuid or _routeParams.uuid }}"
                  - type: hidden
                    name: path
                    value: "{{ _selected[0].path if (_selected | length) else 'root' }}"
                  - type: textInput
                    name: name
                    label: _("Name")
                    validators:
                      required: true
                buttons:
                  submit:
                    text: _("Create")
                    execute:
                      type: request
                      request:
                        service: FileManager
                        method: mkDir
                        successNotification: _("Folder created.")
          - text: _("New file")
            icon: mdi:file-plus-outline
            enabledConstraints:
              maxSelected: 1
              constraint:
                - operator: eq
                  arg0:
                    prop: type
                  arg1: dir
            execute:
              type: formDialog
              formDialog:
                title: _("New file")
                fields:
                  - type: hidden
                    name: uuid
                    value: "{{ _selected[0].uuid or _routeParams.uuid }}"
                  - type: hidden
                    name: path
                    value: "{{ _selected[0].path if (_selected | length) else 'root' }}"
                  - type: textInput
                    name: name
                    label: _("Name")
                    validators:
                      required: true
                buttons:
                  submit:
                    text: _("Create")
                    execute:
                      type: request
                      request:
                        service: FileManager
                        method: mkFile
                        successNotification: _("File created.")
      - type: iconButton
        icon: mdi:rename-box
        tooltip: _("Rename")
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
        execute:
          type: formDialog
          formDialog:
            title: _("Rename")
            fields:
              - type: hidden
                name: uuid
                value: "{{ _selected[0].uuid }}"
              - type: hidden
                name: path
                value: "{{ _selected[0].path }}"
              - type: textInput
                name: name
                label: _("New name")
                value: "{{ _selected[0].name }}"
                validators:
                  required: true
            buttons:
              submit:
                text: _("Rename")
                execute:
                  type: request
                  request:
                    service: FileManager
                    method: rename
                    successNotification: _("Renamed.")
      - type: iconButton
        icon: mdi:information-outline
        tooltip: _("Properties")
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Properties")
              startOnInit: true
              request:
                service: FileManager
                method: getProperties
                params:
                  uuid: "{{ _selected[0].uuid }}"
                  path: "{{ _selected[0].path }}"
      # Moves the items to the trash (if enabled); asks for confirmation.
      - type: iconButton
        icon: mdi:fingerprint
        tooltip: _("Checksum")
        enabledConstraints:
          minSelected: 1
          constraint:
            - operator: eq
              arg0:
                prop: type
              arg1: file
        execute:
          type: formDialog
          formDialog:
            title: _("Checksum")
            fields:
              - type: hidden
                name: uuid
                value: "{{ _selected[0].uuid }}"
              - type: hidden
                name: paths
                value: '{{ _selected | join(",", "path") }}'
              - type: select
                name: algorithm
                label: _("Algorithm")
                store:
                  data:
                    - ["md5", "MD5"]
                    - ["sha1", "SHA-1"]
                    - ["sha256", "SHA-256"]
                    - ["sha512", "SHA-512"]
                validators:
                  required: true
            buttons:
              submit:
                text: _("Calculate")
                execute:
                  type: taskDialog
                  taskDialog:
                    config:
                      title: _("Checksum")
                      startOnInit: true
                      request:
                        service: FileManager
                        method: checksum
                        params:
                          uuid: "{{ uuid }}"
                          paths: "{{ paths }}"
                          algorithm: "{{ algorithm }}"
      - template: delete
        execute:
          type: request
          request:
            service: FileManager
            method: delete
            params:
              uuid: "{{ uuid }}"
              path: "{{ path }}"
